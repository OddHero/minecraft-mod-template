# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx6G
org.gradle.parallel=true

# Mod properties
mod_version=1.0.0
maven_group=com.example
archives_name=examplemod
enabled_platforms=fabric,neoforge

# Dependencies shared by all Minecraft versions.
# Per-version dependencies (Minecraft, Architectury, Fabric API, NeoForge) are in versions/<version>/gradle.properties.
fabric_loader_version=0.19.5

# Stonecutter: acknowledge that the build scripts use the Groovy DSL.
dev.kikugie.stonecutter.hard_mode=true
