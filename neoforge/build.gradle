apply from: rootProject.file('gradle/shared.gradle')

architectury {
    platformSetupLoomIde()
    neoForge()
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

// The common node for the same Minecraft version, e.g. :common:26.2.
def commonNode = ":common:${stonecutter.current.project}"

dependencies {
    neoForge "net.neoforged:neoforge:$project.neoforge_version"
    implementation "dev.architectury:architectury-neoforge:$project.architectury_api_version"

    common(project(path: commonNode)) { transitive false }
    shadowBundle project(path: commonNode, configuration: 'transformProductionNeoForge')
}

processResources {
    def props = [
            version                 : project.version,
            minecraft_version       : project.minecraft_version,
            architectury_api_version: project.architectury_api_version,
    ]
    inputs.properties props

    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''
    mergeServiceFiles()
}

assemble.dependsOn shadowJar
