apply from: rootProject.file('gradle/shared.gradle')

architectury {
    platformSetupLoomIde()
    neoForge()
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

// The common node for the same Minecraft version, e.g. :common:26.2.
def commonNode = ":common:${stonecutter.current.project}"

dependencies {
    neoForge "net.neoforged:neoforge:$project.neoforge_version"
    // modImplementation on obfuscated versions, implementation on unobfuscated ones (see gradle/shared.gradle).
    add(project.modImplementation, "dev.architectury:architectury-neoforge:$project.architectury_api_version")

    common(commonNamed(commonNode)) { transitive false }
    shadowBundle project(path: commonNode, configuration: 'transformProductionNeoForge')
}

processResources {
    def props = [
            version                 : project.version,
            minecraft_range         : project.minecraft_range_neoforge,
            neoforge_range          : project.neoforge_range,
            architectury_api_version: project.architectury_api_version,
    ]
    inputs.properties props

    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    mergeServiceFiles()
}
