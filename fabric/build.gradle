apply from: rootProject.file('gradle/shared.gradle')

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

// The common node for the same Minecraft version, e.g. :common:26.2.
def commonNode = ":common:${stonecutter.current.project}"

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version"
    implementation "dev.architectury:architectury-fabric:$project.architectury_api_version"

    common(project(path: commonNode)) { transitive false }
    shadowBundle project(path: commonNode, configuration: 'transformProductionFabric')
}

processResources {
    def props = [
            version                 : project.version,
            minecraft_version       : project.minecraft_version,
            fabric_loader_version   : rootProject.fabric_loader_version,
            architectury_api_version: project.architectury_api_version,
    ]
    inputs.properties props

    filesMatching('fabric.mod.json') {
        expand props
    }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''
    mergeServiceFiles()
}

assemble.dependsOn shadowJar
