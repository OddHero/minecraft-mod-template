apply from: rootProject.file('gradle/shared.gradle')

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

// The common node for the same Minecraft version, e.g. :common:26.2.
def commonNode = ":common:${stonecutter.current.project}"

dependencies {
    // modImplementation on obfuscated versions, implementation on unobfuscated ones (see gradle/shared.gradle).
    add(project.modImplementation, "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version")
    add(project.modImplementation, "net.fabricmc.fabric-api:fabric-api:$project.fabric_api_version")
    add(project.modImplementation, "dev.architectury:architectury-fabric:$project.architectury_api_version")

    common(commonNamed(commonNode)) { transitive false }
    shadowBundle project(path: commonNode, configuration: 'transformProductionFabric')
}

processResources {
    def props = [
            version                 : project.version,
            minecraft_range         : project.minecraft_range_fabric,
            java_version            : project.java_version,
            fabric_loader_version   : rootProject.fabric_loader_version,
            architectury_api_version: project.architectury_api_version,
    ]
    inputs.properties props

    filesMatching('fabric.mod.json') {
        expand props
    }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    mergeServiceFiles()
}
