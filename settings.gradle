pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        maven { url "https://maven.kikugie.dev/releases" }
        gradlePluginPortal()
    }

    // Every Minecraft version node applies these plugins, so their versions live here, once.
    plugins {
        id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT'
        id 'architectury-plugin' version '3.5-SNAPSHOT'
        id 'com.gradleup.shadow' version '9.6.1'
    }
}

plugins {
    // Allows Gradle to automatically download the JDK required by the build (Java 25).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    // Builds the same sources for several Minecraft versions, see stonecutter.gradle.
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

rootProject.name = 'template'

stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'

    create(getRootProject()) {
        // Each version needs versions/<version>/gradle.properties with its dependency versions.
        versions '26.1.2', '26.2', '26.3'
        // The version the sources in src/ are written for when committed.
        vcsVersion = '26.2'

        branch 'common'
        branch 'fabric'
        branch 'neoforge'
    }
}
